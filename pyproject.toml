[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "obe"
version = "0.1.0"
description = "OBE attainment calculation system"
requires-python = ">=3.11"
dependencies = ["pydantic>=2", "pyyaml", "openpyxl", "xlsxwriter"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["scripts"]
